name: zumma-web-automation

# Fragmento compartido: la API y el worker corren la misma imagen y el mismo entorno,
# solo cambia el comando.
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://webauto:webauto@db:5432/webauto
    REDIS_URL: redis://redis:6379/0
  volumes:
    # Solo las imagenes descargadas se comparten con el host, para poder inspeccionarlas.
    # Montar todo el repo sobre /app pisaria las dependencias instaladas en la imagen.
    - ./storage/images:/app/storage/images
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    container_name: webauto_api
    # Solo la API aplica migraciones, para que no compitan dos procesos por el lock.
    environment:
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql+asyncpg://webauto:webauto@db:5432/webauto
      REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    container_name: webauto_worker
    # El worker arranca cuando la API ya aplico las migraciones.
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    # Chromium necesita mas memoria compartida que el default de 64MB de Docker.
    shm_size: "1gb"

  db:
    image: postgres:16-alpine
    container_name: webauto_db
    environment:
      POSTGRES_DB: webauto
      POSTGRES_USER: webauto
      POSTGRES_PASSWORD: webauto
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Publicado solo en loopback: con "5432:5432" la base queda expuesta en la red local.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webauto -d webauto"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: webauto_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
